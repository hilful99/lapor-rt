<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Lapor Tamu RT 1x24 Jam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#1b2430;--mut:#667085;--line:#dfe4ec;--pri:#1f5fa8;--hd:#1f3864;--ok:#1e6b34;--okbg:#e6f4ea;--er:#9b1c1c;--erbg:#fde8e8;--warn:#8a5a00;--warnbg:#fff3cd;--inp:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--tx:#e8edf3;--mut:#9aa7b6;--line:#2a3746;--pri:#4b8fe0;--hd:#14233f;--ok:#7bd88f;--okbg:#17321f;--er:#ff9b9b;--erbg:#3a1b1b;--warn:#ffd36b;--warnbg:#3a2f12;--inp:#101923}}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--hd);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
h2{margin:0 0 4px;font-size:19px}
h3{margin:20px 0 0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut);font-size:14px;margin:2px 0}
label{display:block;font-size:14px;margin:12px 0 5px;font-weight:600}
input,select,button{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;margin-top:16px;font-weight:700;padding:14px}
button:disabled{opacity:.5;cursor:not-allowed}
button.small{width:auto;margin:0;padding:8px 12px;font-size:14px;background:#2e7d32}
button.ghost{width:auto;margin:0;background:#ffffff26;padding:6px 12px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#nikCount{font-size:13px;color:var(--mut);font-weight:700}
#nikCount.ok{color:var(--ok)}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.chk input{width:22px;height:22px;padding:0;flex:none}
.chk label{margin:0}
.msg{padding:10px;border-radius:10px;margin-top:12px;font-size:14px}
.err{background:var(--erbg);color:var(--er)}.ok{background:var(--okbg);color:var(--ok)}
.center{text-align:center}
.nodok{font-size:22px;font-weight:800;letter-spacing:.02em;margin:10px 0;word-break:break-all;color:var(--pri)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sum div{background:var(--card);border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 3px #0002}
.sum b{display:block;font-size:24px}.sum span{font-size:12px;color:var(--mut)}
#cari{margin-bottom:12px}
.tamu{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px #0002;display:grid;gap:6px}
.tamu small{color:var(--mut)}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.Aktif{background:var(--warnbg);color:var(--warn)}.Selesai{background:var(--okbg);color:var(--ok)}
.kosong{text-align:center;color:var(--mut);padding:30px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{margin:0;background:none;color:var(--mut);border-radius:0;padding:14px 8px;flex:1}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;padding:12px 14px;border-radius:12px;font-size:14px;z-index:9;box-shadow:0 4px 14px #0004;background:var(--card);color:var(--tx)}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1 id="judul">Lapor Tamu RT 1x24 Jam</h1><div class="who"><span id="idPetugas" class="hidden"></span><button id="btnOut" class="ghost hidden">Keluar</button></div></header>
<main>

<section id="viewLogin" class="card">
  <h2>Login Petugas</h2>
  <p class="mut">Masuk dengan ID akun yang diberikan pengurus RT.</p>
  <label for="email">ID Akun</label><input id="email" autocomplete="username" autocapitalize="none" placeholder="contoh: 4ipul4">
  <label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password">
  <button id="btnLogin">Masuk</button>
  <div id="loginMsg"></div>
</section>

<section id="viewApp" class="hidden">
  <div id="tabCatat">
    <div id="formBox" class="card">
      <h2>Catat Tamu Baru</h2>
      <p class="mut">Cocokkan nomor dengan KTP fisik tamu, lalu kembalikan KTP.</p>
      <h3>1 · Identitas tamu</h3>
      <div class="row"><label for="nik">NIK</label><span id="nikCount">0/16</span></div>
      <input id="nik" inputmode="numeric" maxlength="16" placeholder="16 digit angka">
      <label for="nama">Nama Tamu</label><input id="nama" autocomplete="off">
      <label for="hp">No. HP</label><input id="hp" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx (boleh kosong)">
      <label for="asal">Asal Daerah</label><input id="asal" autocomplete="off">
      <h3>2 · Tujuan kunjungan</h3>
      <label for="tujuan">Keperluan</label><input id="tujuan" placeholder="Keluarga, kerja, kontrak, dll">
      <label for="warga">Tuan Rumah yang Dituju</label><select id="warga"></select>
      <label for="pj">Penanggung Jawab</label><input id="pj" placeholder="Terisi otomatis dari tuan rumah, boleh diubah">
      <h3>3 · Verifikasi</h3>
      <div class="chk"><input type="checkbox" id="ktp"><label for="ktp">KTP fisik sudah dicek dan dikembalikan</label></div>
      <button id="btnSave" disabled>Simpan Laporan</button>
      <div id="formMsg"></div>
    </div>
    <div id="sukses" class="card center hidden">
      <div style="font-size:42px">✅</div>
      <h2>Laporan tersimpan</h2>
      <div id="noDok" class="nodok"></div>
      <p class="mut" id="sukNama"></p>
      <button id="btnNext">Catat tamu berikutnya</button>
    </div>
  </div>

  <div id="tabDaftar" class="hidden">
    <div class="sum">
      <div><b id="sAktif">0</b><span>Aktif</span></div>
      <div><b id="sSelesai">0</b><span>Sudah keluar</span></div>
      <div><b id="sTotal">0</b><span>Total</span></div>
    </div>
    <input id="cari" type="search" placeholder="Cari nama atau nomor dokumen">
    <div id="daftar"></div>
  </div>
</section>
</main>
<nav id="tabbar" class="hidden"><button id="tbCatat" class="on">📝 Catat Tamu</button><button id="tbDaftar">📋 Daftar Tamu</button></nav>
<div id="toast" class="toast hidden"></div>

<script>
// ====== ISI DUA BARIS INI (Supabase > Project Settings > API) ======
const SUPABASE_URL = 'https://yfmkedgilmbnrtfckgvc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Fwn89gdmjrJOAzgOlkH6Tw_evFLG39y';
// ===================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let wargaList = [];
let pjManual = false;      // true kalau penanggung jawab diubah manual oleh petugas
let sedangSimpan = false;  // mencegah simpan ganda
let dataTamu = [];

function toast(t, cls) {
  const e = $('toast'); e.textContent = t; e.className = 'toast ' + (cls || '');
  clearTimeout(toast.t); toast.t = setTimeout(() => e.className = 'toast hidden', 3500);
}
function tab(n) {
  $('tabCatat').classList.toggle('hidden', n !== 'catat'); $('tabDaftar').classList.toggle('hidden', n !== 'daftar');
  $('tbCatat').classList.toggle('on', n === 'catat'); $('tbDaftar').classList.toggle('on', n === 'daftar');
  window.scrollTo(0, 0);
}
function updNik() {
  const v = $('nik').value, e = $('nikCount'), ok = v.length === 16 && !cekNik(v);
  e.textContent = v.length + '/16' + (ok ? ' ✓' : ''); e.className = ok ? 'ok' : '';
}
function updBtn() { if (!sedangSimpan) $('btnSave').disabled = !$('ktp').checked; }
function tampilForm() {
  $('sukses').classList.add('hidden'); $('formBox').classList.remove('hidden'); tab('catat'); updNik();
}

const show = (el, msg, cls) => el.innerHTML = msg ? `<div class="msg ${cls}">${msg}</div>` : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const maskNik = n => String(n).slice(0,4) + '********' + String(n).slice(-4);
const jam = t => new Date(t).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});

// Terjemahkan error teknis menjadi bahasa sederhana
function pesanError(err) {
  const m = ((err && err.message) || '').toLowerCase();
  const c = err && err.code;
  if (c === '23505') return 'NIK ini masih tercatat sebagai tamu aktif. Tandai keluar dulu jika sudah pulang.';
  if (m.includes('invalid login')) return 'ID akun atau password salah.';
  if (m.includes('not confirmed')) return 'Akun belum aktif. Hubungi pengurus RT.';
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed'))
    return 'Tidak ada koneksi internet. Periksa sinyal lalu coba lagi.';
  if (c === '42501' || m.includes('row-level security') || m.includes('permission denied'))
    return 'Anda tidak punya izin untuk tindakan ini.';
  if (c === '23514') return 'Format data tidak sesuai. Periksa NIK dan isian lain.';
  if (c === '23503') return 'Data tuan rumah tidak ditemukan. Muat ulang halaman.';
  return 'Terjadi kesalahan. Coba lagi. (kode: ' + (c || (err && err.status) || '-') + ')';
}

// Sesi login habis? Kembalikan ke layar login dengan pesan jelas
const sesiHabis = err => !!err && (err.status === 401 || ['PGRST301','PGRST303'].includes(err.code) || /jwt|expired/i.test(err.message || ''));
async function tanganiSesi(err) {
  if (!sesiHabis(err)) return false;
  await db.auth.signOut();
  await mulai('Sesi login habis. Silakan masuk lagi.');
  return true;
}

// Validasi NIK: 16 digit, kode wilayah, tanggal lahir valid
function cekNik(nik) {
  if (!/^\d{16}$/.test(nik)) return 'NIK harus 16 digit angka.';
  if (nik.startsWith('00') || nik.slice(2,4) === '00') return 'Kode wilayah NIK tidak valid.';
  let hari = parseInt(nik.slice(6,8), 10);
  const bulan = parseInt(nik.slice(8,10), 10);
  const thn = parseInt(nik.slice(10,12), 10);
  if (hari > 40) hari -= 40; // perempuan: tanggal + 40
  const tahun = thn <= (new Date().getFullYear() % 100) ? 2000 + thn : 1900 + thn;
  const d = new Date(tahun, bulan - 1, hari);
  if (bulan < 1 || bulan > 12 || d.getDate() !== hari || d.getMonth() !== bulan - 1)
    return 'Tanggal lahir di dalam NIK tidak valid.';
  return null;
}

// No. HP: boleh kosong; kalau diisi harus 9-15 digit (boleh diawali +, spasi/strip diabaikan)
function cekHp(v) {
  const x = v.replace(/[\s-]/g, '');
  if (!x) return { ok: true, val: '' };
  return /^\+?\d{9,15}$/.test(x) ? { ok: true, val: x } : { ok: false };
}

async function masuk() {
  const id = $('email').value.trim().toLowerCase().split('@')[0];
  if (!id || !$('pass').value) return show($('loginMsg'), 'Isi ID akun dan password.', 'err');
  const tombol = $('btnLogin');
  tombol.disabled = true; tombol.textContent = 'Memproses...';
  try {
    const { error } = await db.auth.signInWithPassword({ email: id + '@petugas.rt', password: $('pass').value });
    if (error) return show($('loginMsg'), 'Login gagal: ' + esc(pesanError(error)), 'err');
    $('pass').value = '';
    await mulai();
  } finally { tombol.disabled = false; tombol.textContent = 'Masuk'; }
}

async function mulai(pesan) {
  const { data: { session } } = await db.auth.getSession();
  $('viewLogin').classList.toggle('hidden', !!session);
  $('viewApp').classList.toggle('hidden', !session);
  $('btnOut').classList.toggle('hidden', !session);
  $('tabbar').classList.toggle('hidden', !session);
  $('idPetugas').classList.toggle('hidden', !session);
  if (!session) {
    $('judul').textContent = 'Lapor Tamu RT 1x24 Jam';
    return show($('loginMsg'), pesan ? esc(pesan) : '', 'err');
  }
  show($('loginMsg'), '');
  $('idPetugas').textContent = 'Petugas: ' + ((session.user.email || '').split('@')[0]);

  // Nama lingkungan di header (opsional, dari tabel pengaturan)
  try {
    const { data: set } = await db.from('pengaturan').select('kunci,nilai');
    const n = (set || []).find(x => x.kunci === 'nama_lingkungan');
    $('judul').textContent = n && n.nilai ? 'Lapor Tamu · ' + n.nilai : 'Lapor Tamu RT 1x24 Jam';
  } catch (e) { /* tabel belum ada: abaikan */ }

  const { data, error } = await db.from('warga').select('*').eq('aktif', true).order('nama');
  if (error && await tanganiSesi(error)) return;
  wargaList = data || [];
  $('warga').innerHTML = '<option value="">- pilih tuan rumah -</option>' +
    wargaList.map(w => `<option value="${esc(w.id)}">${esc(w.nama)}${w.blok ? ' (' + esc(w.blok) + ')' : ''}</option>`).join('');
  muatDaftar();
}

async function simpan() {
  if (sedangSimpan) return;               // abaikan tekan kedua kali
  sedangSimpan = true;
  const tombol = $('btnSave');
  tombol.disabled = true; tombol.textContent = 'Menyimpan...';
  try { await prosesSimpan(); }
  finally { sedangSimpan = false; tombol.disabled = !$('ktp').checked; tombol.textContent = 'Simpan Laporan'; }
}

async function prosesSimpan() {
  const msg = $('formMsg'); show(msg, '');
  const nik = $('nik').value.trim();
  const salah = cekNik(nik);
  if (salah) return show(msg, salah, 'err');
  if (!$('nama').value.trim()) return show(msg, 'Nama tamu wajib diisi.', 'err');
  const hp = cekHp($('hp').value);
  if (!hp.ok) return show(msg, 'No. HP tidak valid. Isi 9-15 digit angka, atau kosongkan.', 'err');
  if (!$('warga').value) return show(msg, 'Pilih tuan rumah yang dituju.', 'err');
  if (!$('pj').value.trim()) return show(msg, 'Penanggung jawab wajib diisi.', 'err');
  if (!$('ktp').checked) return show(msg, 'Centang dulu: KTP fisik sudah dicek.', 'err');

  const { data, error } = await db.from('tamu').insert({
    nik, nama: $('nama').value.trim(), no_hp: hp.val, asal: $('asal').value.trim(),
    tujuan: $('tujuan').value.trim(), warga_id: $('warga').value,
    penanggung_jawab: $('pj').value.trim(), ktp_dicek: true
  }).select().single();

  if (error) {
    if (await tanganiSesi(error)) return;
    return show(msg, 'Gagal menyimpan: ' + esc(pesanError(error)), 'err');
  }
  show(msg, '');
  $('noDok').textContent = data.no_dokumen;
  $('sukNama').textContent = 'Tamu: ' + data.nama;
  $('formBox').classList.add('hidden'); $('sukses').classList.remove('hidden'); window.scrollTo(0, 0);
  ['nik','nama','hp','asal','tujuan','pj'].forEach(i => $(i).value = '');
  $('warga').value = ''; $('ktp').checked = false; pjManual = false;
  muatDaftar();
}

async function muatDaftar() {
  if (!dataTamu.length) $('daftar').innerHTML = '<div class="kosong">Memuat...</div>';
  const awal = new Date(); awal.setHours(0,0,0,0);
  const { data, error } = await db.from('tamu')
    .select('*, warga(nama, blok)')
    .or(`tgl_keluar.is.null,tgl_masuk.gte.${awal.toISOString()}`)
    .order('tgl_masuk', { ascending: false });
  if (error) {
    if (await tanganiSesi(error)) return;
    return $('daftar').innerHTML = `<div class="kosong">Gagal memuat daftar: ${esc(pesanError(error))}</div>`;
  }
  dataTamu = data;
  renderDaftar();
}

function renderDaftar() {
  const q = $('cari').value.trim().toLowerCase();
  const aktif = dataTamu.filter(t => !t.tgl_keluar).length;
  $('sAktif').textContent = aktif; $('sSelesai').textContent = dataTamu.length - aktif; $('sTotal').textContent = dataTamu.length;
  const list = dataTamu.filter(t => !q || (t.nama || '').toLowerCase().includes(q) || (t.no_dokumen || '').toLowerCase().includes(q));
  $('daftar').innerHTML = list.length ? list.map(t => `
    <div class="tamu">
      <div class="row"><b>${esc(t.nama)}</b><span class="tag ${esc(t.status)}">${esc(t.status)}</span></div>
      <small>${esc(t.no_dokumen)} · ${esc(maskNik(t.nik))}</small>
      <div>Dituju: ${esc(t.warga?.nama)} <small>· PJ: ${esc(t.penanggung_jawab)}</small></div>
      <div class="row"><small>Masuk ${jam(t.tgl_masuk)}</small>
        ${t.tgl_keluar ? `<small>Keluar ${jam(t.tgl_keluar)}</small>` : `<button class="small" onclick="keluar('${esc(t.id)}', this)">Tandai keluar</button>`}</div>
    </div>`).join('')
    : `<div class="kosong">${dataTamu.length ? 'Tidak ada yang cocok.' : 'Belum ada tamu hari ini.'}</div>`;
}

async function keluar(id, tombol) {
  if (!confirm('Tandai tamu ini sudah keluar?')) return;
  tombol.disabled = true; tombol.textContent = 'Memproses...';
  const { error } = await db.from('tamu').update({ tgl_keluar: new Date().toISOString(), status: 'Selesai' }).eq('id', id);
  if (error) {
    if (await tanganiSesi(error)) return;
    toast('Gagal menandai keluar: ' + pesanError(error), 'err');
  } else toast('Tamu ditandai keluar', 'ok');
  muatDaftar();
}

$('btnLogin').onclick = masuk;
$('btnSave').onclick = simpan;
$('btnOut').onclick = async () => {
  await db.auth.signOut();
  ['nik','nama','hp','asal','tujuan','pj','email','pass'].forEach(i => $(i).value = '');
  pjManual = false; dataTamu = []; $('daftar').innerHTML = '';
  tampilForm();
  mulai();
};
['email', 'pass'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key === 'Enter') masuk(); }));
$('nik').addEventListener('input', () => { $('nik').value = $('nik').value.replace(/\D/g, '').slice(0, 16); });
$('pj').addEventListener('input', () => { pjManual = $('pj').value.trim() !== ''; });
$('warga').onchange = () => {
  const w = wargaList.find(x => x.id === $('warga').value);
  if (!pjManual) $('pj').value = w ? w.nama : '';
};
$('nik').addEventListener('input', updNik);
$('ktp').addEventListener('change', updBtn);
$('cari').addEventListener('input', renderDaftar);
$('btnNext').onclick = tampilForm;
$('tbCatat').onclick = () => tab('catat');
$('tbDaftar').onclick = () => { tab('daftar'); muatDaftar(); };
mulai();
</script>
</body>
</html>
